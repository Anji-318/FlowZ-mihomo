name: CI

# 验证门禁：lint + test + build（tsc/vite）+ 内核配置校验，三平台。职责=「改动是否正确」，快速反馈。
# 打包（出安装包）在 package.yml / release.yml，不在这里跑。
#
# 为什么要三平台：发布物覆盖 Windows / macOS / Linux，而主进程平台分支密集（路径分隔符、TUN 适配器、
# 提权 helper）。此前只跑 mac/win，Linux 专属代码（systemd-resolved、pkexec、/usr/local/lib/flowz）
# 直到发版才第一次编译 —— 现在补齐。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支新 push 取消在途 PR 跑（省算力、加快反馈）；main push 不取消，保证每次合并都完整验证。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      # 随包内核不入库（.gitignore），CI 现拉现用。缓存键绑 manifest 内容：升核自动失效。
      - name: Cache bundled cores
        uses: actions/cache@v4
        with:
          path: |
            resources/win/mihomo.exe
            resources/linux/mihomo
            resources/mac-x64/mihomo
            resources/mac-arm64/mihomo
          key: cores-${{ runner.os }}-${{ hashFiles('src/shared/core-manifest.json') }}

      - name: Fetch bundled cores (sha256 pinned)
        run: npm run fetch:core

      # 发布门禁下沉到 CI：用真实内核 `mihomo -t` 校验生成的配置。
      # 这是整次 mihomo 迁移中风险最高的 559 行代码，此前只有「能生成 YAML」的冒烟，改了错映射只能真机发现。
      - name: Verify generated mihomo config
        run: npm run verify:config

      - name: Build application
        run: npm run build
