name: Release

# 只允许手动触发：在 Actions 页面点「Run workflow」，填版本号（如 4.5.1）后构建三平台安装包并发布。
#
# 为什么去掉 tag push 触发：本项目要求「发布 = 一次显式决定」。tag 可被本地误推、也可被脚本连推多个，
# 一旦触发就会自动 bump 版本、改 main、发 Release —— 这些都该由人确认版本号后再发生。
#
# 覆盖语义（输入已存在的版本号）：
#   1) package.json 用 --allow-same-version bump（版本没变也能跑通）；
#   2) tag 用 -f 强制移到当前 commit；
#   3) 同名 Release 先删后建，附件整体替换（overwrite_files 双保险）。
#   → 不存在「同号两版并存」，也不会因为「版本已存在」而失败。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 4.5.1，无需 v 前缀；填已存在的版本号 = 覆盖该版本）'
        required: true
        type: string

# 发布串行化：两个 Release 同时跑会争抢 main 的版本提交与同名 tag。
# 不 cancel：已开始的构建跑完再让下一个开始，避免留下半个 Release。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # prepare 推 version bump commit + tag；create-release 删/建 Release

jobs:
  # 版本号落库 + 打 tag。所有下游 job 都从这里的 output 取版本，保证「构建的就是输入的版本」。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate & apply version
        id: v
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          V="${V#v}"
          V="$(echo "$V" | tr -d '[:space:]')"
          # 严格 semver（允许预发布后缀），拒绝 1.2 / latest / 空 之类的脏输入进 package.json。
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号「$V」不合法，须为 x.y.z（可选 -预发布后缀），如 4.5.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # --allow-same-version：相同版本号重跑时 npm version 不报错（覆盖发布语义的核心）。
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "本次发布版本：$V"

      - name: Commit version bump & force tag
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 版本没变（同号覆盖）时 commit 为空，跳过提交只移 tag。
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(release): v${V}"
          git push origin main
          # -f：同名 tag 强制移到当前 commit → 「相同版本号覆盖旧版本」。
          git tag -f "v${V}"
          git push -f origin "v${V}"

  release:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Resolve version
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
          echo "发布版本：${{ needs.prepare.outputs.version }}"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # checkout prepare 刚打好的 tag：构建内容 = 该 tag 指向的提交（含版本 bump）。
          ref: refs/tags/v${{ needs.prepare.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 三个平台都要 Go：build-helper.mjs 会交叉编译 mac/win/linux 三套 helper，而 package:linux 同样调用它；
      # REQUIRE_HELPER=1 时缺工具链会直接失败（避免静默发出无 helper 的包）。
      - name: Setup Go (提权 helper, all platforms)
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm ci

      - name: Build application
        run: npm run build

      # package:* 链路已内置 fetch:core（双 sha256 校验）+ verify:config（真核 mihomo -t）。
      - name: Package application
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        run: |
          # electron-builder 多架构下会把其中一个架构放进【无后缀】的 dist-package/mac/，
          # 另一个放 dist-package/mac-<arch>/。故按 arch 后缀目录优先、回退无后缀目录，并用 lipo
          # 校验确属目标架构；缺则【报错失败】（避免绿灯却漏发某个架构）。
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/FlowZ Mihomo-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/FlowZ Mihomo.app" "dist-package/mac/FlowZ Mihomo.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(ls "$CAND"/Contents/MacOS/* 2>/dev/null | head -1)
              if [ -n "$EXE" ] && lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"; break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 FlowZ Mihomo.app（查了 dist-package/mac-${ARCH}/ 与 dist-package/mac/）——发布将缺 mac-${ARCH} 包，请检查 package:mac 的 electron-builder --${ARCH} 产出。"
              exit 1
            fi
            echo "Using ${ARCH} app bundle: $APP_PATH"
            echo "Ad-hoc deep signing ${ARCH} app bundle (fix Team ID mismatch)..."
            codesign --force --deep --sign - "$APP_PATH"

            echo "Creating ${ARCH} DMG..."
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            # ad-hoc 签名（无付费 Developer ID/公证）→ 从 DMG 拖出的 app 带 quarantine，首次打开报「已损坏」，
            # 须 xattr -cr。DMG 内附首次打开引导（中英），排在 app 前更显眼。
            cp "build/macos-dmg-open-guide.txt" "$TEMP_DIR/0 首次打开必读 READ ME FIRST.txt"
            hdiutil create -volname "FlowZ Mihomo ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" \
              -ov -format UDZO \
              "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            echo "Created: $DMG_PATH"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.exe
            dist-package/*.dmg
            dist-package/*.AppImage
            dist-package/*.deb
          retention-days: 5

  create-release:
    needs: [prepare, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # 生成 SHA256SUMS：应用自更新的完整性锚是 GitHub API 的 asset.digest，但
      #   ① 手工下载的用户没有 API 摘要可查；② 镜像站可能被投毒，用户需要独立核对手段。
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sha256sum {} + | sed 's#\./##' | sort -k2 > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          echo "--- SHA256SUMS ---"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      # 覆盖语义的关键一步：同名 Release 已存在则整体删除（含旧附件与 notes），下一步重建并挂新产物。
      # tag 已在 prepare 阶段被 -f 移到新 commit。
      - name: Delete existing release with same tag (overwrite)
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "发现已存在的 Release v${VERSION}，删除以覆盖发布"
            gh release delete "v${VERSION}" --yes
          else
            echo "无同名 Release，直接新建"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          # 直接发布（非 draft）：应用内的更新检查读的是已发布 Release，draft 对其不可见。
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            FlowZ Mihomo ${{ env.VERSION }}（mihomo 内核）

            - 内核：mihomo ${{ env.VERSION }} 构建集（版本以仓库 `src/shared/core-manifest.json` 为准）
            - 该版本安装包的 sha256 见附件 `SHA256SUMS.txt`，安装前请核对
            - 与上游 sing-box 版不兼容：请勿混装（appId `com.flowz.mihomo`）
          overwrite_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
