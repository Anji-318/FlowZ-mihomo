name: Package

# 只允许手动触发：Actions 页面「Run workflow」→ 三平台完整打包，产出安装包 artifact（不发 Release）。
#
# 与 release.yml 的分工：
#   · Package（本文件）：手动取包 / 验证打包链。出 Windows 与 Linux 安装包 + SHA256SUMS，保留 3 天。
#   · Release：手动输入版本号 → bump 版本 + 打 tag + 出三平台安装包（含 macOS DMG）+ 发布 Release。
#
# 不再随 push/PR 自动跑：安装包构建会拉内核/面板/electron-builder 工具链，耗时长且对本项目
# 「发布 = 人确认版本号」的语义没有帮助。代码正确性由 ci.yml（lint/test/build/配置校验）守。
on:
  workflow_dispatch:

# 手动构建串行化：避免两次打包同时写 dist-package / 抢 electron-builder 缓存。
concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      REQUIRE_HELPER: "1"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 提权 helper 二进制不入库（.gitignore），现编现打；三平台都要 Go（build-helper 交叉编译三套）。
      - name: Setup Go (提权 helper)
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache: false

      # Linux 打 .deb 需要 fpm（ruby），与 release.yml 同源安装。
      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: npm ci

      # package:* 链路已内置：build:helper → fetch:core（双 sha256）→ verify:config（真核 mihomo -t）
      # → fetch:dashboard → build → electron-builder。任一环节失败即整步失败。
      - name: Package full
        run: npm run package:${{ matrix.platform }}

      # 上传可直接安装的产物（Windows NSIS/portable、Linux AppImage/deb）。
      # macOS 的 DMG 由 release.yml 用 hdiutil 统一手搓（electron-builder 的 mac target 是 dir），
      # 这里不重复造轮子 —— 需要 mac 安装包请走 Release workflow。
      - name: Upload installers
        if: matrix.platform != 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist-package/*.exe
            dist-package/*.AppImage
            dist-package/*.deb
          retention-days: 3

      - name: Generate SHA256SUMS (installers)
        if: matrix.platform != 'mac'
        run: |
          cd dist-package &&
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sha256sum {} + > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
